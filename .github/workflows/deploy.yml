name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint --workspace=@nama/web

      - name: Build
        run: npm run build --workspace=@nama/web
        env:
          VITE_NETWORK: "test"
          VITE_WC_PROJECT_ID: ${{ secrets.VITE_WC_PROJECT_ID }}
          VITE_PRIVY_APP_ID: ${{ secrets.VITE_PRIVY_APP_ID }}
          VITE_PRIVY_CLIENT_ID: ${{ secrets.VITE_PRIVY_CLIENT_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: 🔍 تحقق من أن التطبيق منشور على testnet
        run: |
          DEPLOY_URL="${{ steps.deployment.outputs.page_url }}"
          echo "الرابط المنشور: $DEPLOY_URL"

          # 1. تأكد أن الصفحة تستجيب بـ 200
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL")
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ فشل: HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ الصفحة تستجيب بـ 200"

          # 2. تأكد أن index.html يحتوي على إعدادات testnet
          if curl -s "$DEPLOY_URL" | grep -q "testnet.vechain.org"; then
            echo "✅ تم تأكيد وجود إعدادات testnet في البناء"
          else
            echo "⚠️ تحذير: لم يتم العثور على testnet.vechain.org في الصفحة"
          fi

          echo "🎉 التحقق اكتمل — التطبيق منشور على: $DEPLOY_URL"
